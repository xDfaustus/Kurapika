<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurapika Hunter x Hunter — Perfil Interactivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #ffcc00;
      --primary-bright: #ffee55;
      --primary-glow: rgba(255, 204, 0, 0.45);
      --primary-dark: #cc9900;
      --bg-dark: #0a0a0f;
      --accent-red: #ff2a4b;
      --chain-gold: #ffaa00;
    }

    body.mode-scarlet {
      --primary: #ff1a40;
      --primary-bright: #ff6680;
      --primary-glow: rgba(255, 26, 64, 0.55);
      --primary-dark: #b3001e;
      --chain-gold: #ff3355;
    }

    body.mode-judgement {
      --primary: #00f0ff;
      --primary-bright: #80f7ff;
      --primary-glow: rgba(0, 240, 255, 0.5);
      --primary-dark: #0099a6;
      --chain-gold: #00d9e6;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #040508;
      color: #f0f4f8;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.5s ease;
    }

    /* Contenedor Principal del Perfil */
    .profile-card {
      position: relative;
      width: min(100%, 960px);
      min-height: 780px;
      background: radial-gradient(circle at 50% 40%, rgba(20, 22, 35, 0.8) 0%, rgba(6, 7, 12, 0.98) 75%), #07090e;
      border: 2px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 0 35px var(--primary-glow), inset 0 0 80px rgba(0,0,0,0.9);
      overflow: hidden;
      isolation: isolate;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    /* Fondo con Texto Gigante al Agua */
    .watermark-text {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(80px, 19vw, 210px);
      font-weight: 900;
      color: var(--primary);
      opacity: 0.12;
      letter-spacing: -0.06em;
      white-space: nowrap;
      user-select: none;
      z-index: 1;
      text-shadow: 0 0 30px var(--primary-glow);
      transition: color 0.5s ease;
    }

    /* Efecto de Rayos / Canvas Aura */
    #auraCanvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* Cadenas SVG */
    .chain-svg {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 0 8px var(--primary));
      transition: filter 0.5s ease;
    }

    /* Topbar */
    .nav-link {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #e2e8f0;
      transition: all 0.2s;
      position: relative;
    }
    .nav-link.active, .nav-link:hover {
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary-glow);
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    /* Handle Pill */
    .user-pill {
      background: rgba(10, 10, 15, 0.85);
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      padding: 6px 18px;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 0 15px var(--primary-glow);
      transition: all 0.5s ease;
    }

    /* Fecha Vertical */
    .date-badge {
      position: absolute;
      left: 28px;
      top: 240px;
      z-index: 6;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .date-numbers {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      font-weight: 900;
      line-height: 0.85;
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
      transition: color 0.5s ease;
    }
    .date-month {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--primary);
      text-transform: uppercase;
      transition: color 0.5s ease;
    }

    /* Emblemas / Badges Laterales */
    .badge-stack {
      position: absolute;
      right: 28px;
      top: 175px;
      z-index: 6;
      background: var(--primary);
      border-radius: 16px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: background-color 0.5s ease;
    }
    .badge-item {
      width: 52px;
      height: 52px;
      background: #080a10;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Título Central Rotado "MCYSTN DESIGN" */
    .hero-title-lockup {
      position: absolute;
      top: 540px;
      left: 50%;
      transform: translateX(-50%) rotate(-7deg);
      z-index: 7;
      background: rgba(5, 6, 10, 0.92);
      border: 2px solid var(--primary);
      padding: 6px 20px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px var(--primary-glow);
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      transition: border-color 0.5s ease;
    }
    .hero-title-main {
      font-family: 'Cinzel Decorative', 'Orbitron', serif;
      font-size: clamp(32px, 6vw, 68px);
      font-weight: 900;
      color: var(--primary);
      line-height: 0.9;
      letter-spacing: -1px;
      text-shadow: 3px 3px 0px #000;
      transition: color 0.5s ease;
    }
    .hero-title-sub {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(12px, 2vw, 20px);
      font-weight: 800;
      letter-spacing: 3px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #ffffff;
    }

    /* Tarjeta Ojos Escarlata */
    .scarlet-eyes-card {
      position: absolute;
      left: 28px;
      bottom: 180px;
      width: 220px;
      height: 85px;
      border: 2px solid var(--primary);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      z-index: 6;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: border-color 0.5s ease;
    }
    .scarlet-eyes-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      filter: contrast(1.1) brightness(1.05);
      transition: transform 0.4s ease;
    }
    .scarlet-eyes-card:hover img {
      transform: scale(1.08);
    }

    /* Miniatura Lateral Derecha */
    .mini-figure-card {
      position: absolute;
      right: 28px;
      bottom: 150px;
      width: 110px;
      height: 165px;
      border: 2px solid var(--primary);
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      z-index: 6;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: border-color 0.5s ease;
    }
    .mini-figure-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .mini-figure-card:hover img {
      transform: scale(1.08);
    }

    /* Cita Inferior */
    .quote-bottom {
      position: absolute;
      left: 28px;
      bottom: 85px;
      z-index: 6;
      max-width: 380px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      color: #e2e8f0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* Footer Ticker */
    .footer-ticker {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      z-index: 6;
      display: flex;
      justify-content: space-around;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 2px;
      text-transform: lowercase;
    }

    /* Botones de Navegación de Energía */
    .energy-btn {
      background: rgba(10, 12, 20, 0.85);
      border: 1px solid var(--primary);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.25s ease;
      box-shadow: 0 0 10px var(--primary-glow);
    }
    .energy-btn:hover {
      background: var(--primary);
      color: #000;
      transform: scale(1.12);
      box-shadow: 0 0 20px var(--primary);
    }

    /* Reproductor compacto en el espacio de los emblemas */
    .music-player {
      position: absolute;
      top: 175px;
      right: 28px;
      z-index: 8;
      width: 205px;
      padding: 13px;
      border: 1.5px solid var(--primary);
      border-radius: 14px;
      background: rgba(5, 7, 12, 0.92);
      box-shadow: 0 0 20px var(--primary-glow), inset 0 0 18px rgba(255,255,255,0.025);
      backdrop-filter: blur(10px);
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }
    .music-player-heading {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }
    .music-player-icon {
      display: grid;
      place-items: center;
      flex: 0 0 36px;
      height: 36px;
      border-radius: 9px;
      color: #05070b;
      background: var(--primary);
      font-size: 25px;
      font-weight: 900;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .music-player-labels {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 2px;
    }
    .music-player-labels strong {
      color: var(--primary);
      font: 800 11px 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
    .music-player-labels span {
      color: #d7dce5;
      font-size: 12px;
      line-height: 1.2;
    }
    .music-track-select {
      width: 100%;
      margin: 0 0 8px;
      padding: 7px 8px;
      color: #f8fafc;
      background: #10131b;
      border: 1px solid var(--primary);
      border-radius: 7px;
      font: 600 11px 'Rajdhani', sans-serif;
      outline: none;
    }
    /* Audio oculto: se controla con los botones personalizados */
    .music-player audio {
      display: none;
    }
    .music-player-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 7px;
    }
    .music-player-buttons button {
      width: 29px;
      height: 29px;
      border: 1px solid var(--primary);
      border-radius: 50%;
      color: var(--primary);
      background: #0b0d13;
      cursor: pointer;
      font-size: 13px;
    }
    .music-player-buttons button:hover {
      color: #05070b;
      background: var(--primary);
    }
    .music-volume {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 9px;
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.035);
      color: var(--primary);
    }
    .music-volume-icon {
      flex: 0 0 auto;
      font-size: 15px;
      line-height: 1;
    }
    .music-volume input[type="range"] {
      width: 100%;
      min-width: 0;
      height: 5px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .music-volume-value {
      width: 29px;
      flex: 0 0 29px;
      color: #f8fafc;
      font: 700 10px 'Orbitron', sans-serif;
      text-align: right;
    }
    @media (max-width: 640px) {
      .music-player {
        top: 145px;
        right: 12px;
        width: 175px;
        padding: 9px;
      }
      .music-player-hint { font-size: 9px; }
    }

    /* Animación de Resplandor Aura */
    @keyframes auraPulse {
      0%, 100% { filter: drop-shadow(0 0 20px var(--primary-glow)) brightness(1); }
      50% { filter: drop-shadow(0 0 40px var(--primary)) brightness(1.15); }
    }
    .hero-character {
      animation: auraPulse 4s infinite ease-in-out;
    }

    /* Controles de Configuración Flotantes */
    .config-panel {
      backdrop-filter: blur(12px);
      background: rgba(10, 12, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>

<!-- JS / LÓGICA DE INTERACTIVIDAD Y CANVASES -->
<script>
  // --- Lógica del Sistema de Modos de Energía Nen ---
  const modes = [
    { id: 'gold', class: '', color: '#ffcc00' },
    { id: 'scarlet', class: 'mode-scarlet', color: '#ff1a40' },
    { id: 'judgement', class: 'mode-judgement', color: '#00f0ff' }
  ];
  let currentModeIdx = 0;

  function applyMode() {
    const mode = modes[currentModeIdx];
    document.body.className = "p-2 sm:p-6 flex flex-col items-center justify-center min-h-screen " + mode.class;
  }

  document.getElementById('nextModeBtn').addEventListener('click', () => {
    currentModeIdx = (currentModeIdx + 1) % modes.length;
    applyMode();
  });

  document.getElementById('prevModeBtn').addEventListener('click', () => {
    currentModeIdx = (currentModeIdx - 1 + modes.length) % modes.length;
    applyMode();
  });

  // --- Playlist del reproductor: 3 pistas instrumentales de muestra ---
  const musicTracks = [
    { title: 'Nen Theme • Track 1', name: '01 · SoundHelix Song 1', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
    { title: 'Scarlet Aura • Track 2', name: '02 · SoundHelix Song 2', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
    { title: 'Judgement Chain • Track 3', name: '03 · SoundHelix Song 3', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
  ];
  const musicAudio = document.getElementById('musicAudio');
  const musicTrackSelect = document.getElementById('musicTrackSelect');
  const musicTrackTitle = document.getElementById('musicTrackTitle');
  const musicStatus = document.getElementById('musicStatus');
  const musicPlay = document.getElementById('musicPlay');
  const musicVolume = document.getElementById('musicVolume');
  const musicVolumeValue = document.getElementById('musicVolumeValue');
  const musicVolumeIcon = document.getElementById('musicVolumeIcon');
  let currentTrack = 0;

  function updateMusicVolume() {
    const volume = Number(musicVolume.value);
    musicAudio.volume = volume / 100;
    musicVolumeValue.textContent = volume + '%';
    musicVolumeIcon.textContent = volume === 0 ? '🔇' : volume < 50 ? '🔉' : '🔊';
    musicVolume.setAttribute('aria-valuetext', volume + '%');
  }

  musicVolume.addEventListener('input', updateMusicVolume);
  updateMusicVolume();

  function loadMusicTrack(index, autoplay = false) {
    currentTrack = (index + musicTracks.length) % musicTracks.length;
    const track = musicTracks[currentTrack];
    musicAudio.src = track.src;
    musicTrackSelect.value = String(currentTrack);
    musicTrackTitle.textContent = track.title;
    musicPlay.textContent = '▶';
    if (autoplay) {
      musicAudio.play().then(() => {
        musicPlay.textContent = 'Ⅱ';
      }).catch(() => {
        musicPlay.textContent = '▶';
      });
    } else {
      musicAudio.load();
    }
  }

  musicTrackSelect.addEventListener('change', () => loadMusicTrack(Number(musicTrackSelect.value)));
  document.getElementById('musicPrev').addEventListener('click', () => loadMusicTrack(currentTrack - 1, true));
  document.getElementById('musicNext').addEventListener('click', () => loadMusicTrack(currentTrack + 1, true));
  musicPlay.addEventListener('click', () => {
    if (musicAudio.paused) {
      musicAudio.play().then(() => { musicPlay.textContent = 'Ⅱ'; })
        .catch(() => { musicPlay.textContent = '▶'; });
    } else {
      musicAudio.pause();
      musicPlay.textContent = '▶';
    }
  });
  musicAudio.addEventListener('play', () => { musicPlay.textContent = 'Ⅱ'; });
  musicAudio.addEventListener('pause', () => { musicPlay.textContent = '▶'; });
  musicAudio.addEventListener('ended', () => loadMusicTrack(currentTrack + 1, true));
  musicAudio.addEventListener('error', () => {
    musicPlay.textContent = '▶';
  });
  loadMusicTrack(0);

  // --- Animation Loop: Partículas de Aura Nen en Canvas ---
  const canvas = document.getElementById('auraCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const rect = document.getElementById('profileCard').getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Partículas de Energía
  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + Math.random() * 50;
      this.size = Math.random() * 3 + 1;
      this.speedY = Math.random() * 2 + 1;
      this.speedX = (Math.random() - 0.5) * 1.5;
      this.opacity = Math.random() * 0.8 + 0.2;
    }
    update() {
      this.y -= this.speedY;
      this.x += this.speedX;
      this.opacity -= 0.005;
      if (this.y < 0 || this.opacity <= 0) {
        this.reset();
      }
    }
    draw() {
      const computedColor = getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#ffcc00';
      ctx.fillStyle = computedColor;
      ctx.globalAlpha = this.opacity;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  const particles = Array.from({ length: 45 }, () => new Particle());

  // Animación continua
  function animateAura() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animateAura);
  }
  animateAura();
</script>
</body>
